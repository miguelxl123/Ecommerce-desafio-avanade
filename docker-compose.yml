version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ecommerce-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    ports:
      - "5672:5672"    # AMQP port
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ecommerce-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 3

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    container_name: ecommerce-api-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__RabbitMQ=amqp://admin:admin123@rabbitmq:5672
      - ReverseProxy__Clusters__vendas-cluster__Destinations__destination1__Address=http://microservico-vendas:5001/
      - ReverseProxy__Clusters__estoque-cluster__Destinations__destination1__Address=http://microservico-estoque:5002/
    ports:
      - "5000:5000"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-network
    restart: unless-stopped

  # Microserviço de Vendas
  microservico-vendas:
    build:
      context: .
      dockerfile: src/Ecommerce.Vendas/Dockerfile
    container_name: ecommerce-vendas
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5001
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=vendasdb;Username=postgres;Password=postgres;Port=5432
      - ConnectionStrings__RabbitMQ=amqp://admin:admin123@rabbitmq:5672
      - Services__Estoque=http://microservico-estoque:5002
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-network
    restart: unless-stopped

  # Microserviço de Estoque
  microservico-estoque:
    build:
      context: .
      dockerfile: src/Ecommerce.Estoque/Dockerfile
    container_name: ecommerce-estoque
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5002
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=inventario;Username=postgres;Password=postgres;Port=5432
      - ConnectionStrings__RabbitMQ=amqp://admin:admin123@rabbitmq:5672
    ports:
      - "5002:5002"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-network
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  ecommerce-network:
    driver: bridge